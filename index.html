<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Space Defense - Phase 1 Starter</title>
<style>
  body { background: #1a1a1a; color: #efefef; font-family: monospace; display: flex; flex-direction: column; align-items: center; }
  canvas { border: 2px solid #444; margin-top: 16px; background: #101018; }
  p { color: #969696; }
</style>
</head>
<body>
<h1>SPACE DEFENSE <small>(Phase 1 starter)</small></h1>
<p>Arrows/AD to move, Space to start/fire, P to pause/resume, R to restart after game over.</p>
<canvas id="game" width="800" height="600"></canvas>
<script>
// Space Defense R1-R7

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// --- score (R4); restarting keeps this tab's hi-score
let score = 0;
let hiScore = 0;
const HI_SCORE_KEY = 'space-defense-hi-score';
try {
  const saved = Number(sessionStorage.getItem(HI_SCORE_KEY));
  if (Number.isSafeInteger(saved) && saved >= 0) hiScore = saved;
} catch (_) { /* Keep playing if browser storage is unavailable. */ }
const ROW_POINTS = [30, 20, 10, 10]; // top to bottom

// --- player
const ship = { x: W/2, y: H-50, w: 48, h: 20, speed: 300 };
let lives = 3;
let lostByDescent = false;
let invulnerabilityTimer = 0;
const keys = {};
let gameState = 'START';
document.addEventListener('keydown', e => {
  if (e.key === ' ') e.preventDefault();
  if (!e.repeat) {
    if (gameState === 'START' && e.key === ' ') {
      startGame();
      return;
    }
    if (gameState === 'GAME_OVER' && e.key.toLowerCase() === 'r') {
      startGame();
      return;
    }
    if (e.key.toLowerCase() === 'p' && (gameState === 'PLAYING' || gameState === 'PAUSED')) {
      gameState = gameState === 'PLAYING' ? 'PAUSED' : 'PLAYING';
      for (const key in keys) delete keys[key];
      return;
    }
  }
  if (gameState === 'PLAYING') keys[e.key] = true;
});
document.addEventListener('keyup',   e => { keys[e.key] = false; });

// --- one player bullet on screen at a time (PRD 4: forces aimed shots)
let bullet = null; // {x, y}

// --- shields (R6); damage persists between waves
const SHIELD_HITS = 6;
const shields = Array.from({ length: 4 }, (_, i) => ({
  x: W * (i + 1) / 5 - 36, y: H - 120, w: 72, h: 32, hits: SHIELD_HITS
}));

function hitShield(x, top, bottom) {
  for (const shield of shields) {
    if (shield.hits > 0 && x + 2 >= shield.x && x - 2 <= shield.x + shield.w &&
        bottom >= shield.y && top <= shield.y + shield.h) {
      shield.hits--;
      return true;
    }
  }
  return false;
}

// --- invader fire (R1); the hit flash accompanies R2 invulnerability
const enemyBullets = [];
let enemyFireTimer = nextEnemyFireDelay();
let shipHitFlash = 0;

function nextEnemyFireDelay() { return 0.8 + Math.random() * 1.2; }

// --- invader grid: 4 rows x 8 cols, marching as ONE unit
const ROWS = 4, COLS = 8, SIZE = 48;
let invaders, marchDir, marchSpeed;
let wave = 1;
let waveBannerTimer = 0;

function spawnGrid() {
  invaders = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      invaders.push({ col: c, row: r, alive: true });
  gridX = (W - COLS*SIZE) / 2;
  gridY = 60 + (wave - 1) * SIZE;
  marchDir = 1;
  marchSpeed = 30 * Math.pow(1.2, wave - 1); // px/s; increases per kill below
}
let gridX, gridY;

function startGame() {
  score = 0;
  ship.x = W / 2;
  lives = 3;
  lostByDescent = false;
  invulnerabilityTimer = 0;
  shipHitFlash = 0;
  bullet = null;
  enemyBullets.length = 0;
  enemyFireTimer = nextEnemyFireDelay();
  wave = 1;
  waveBannerTimer = 0;
  for (const shield of shields) shield.hits = SHIELD_HITS;
  for (const key in keys) delete keys[key];
  spawnGrid();
  gameState = 'PLAYING';
}

function aliveInvaders() { return invaders.filter(i => i.alive); }

function invaderScreenPos(inv) {
  return { x: gridX + inv.col*SIZE, y: gridY + inv.row*SIZE };
}

function update(dt) {
  if (gameState !== 'PLAYING') return;
  if (waveBannerTimer > 0) {
    waveBannerTimer = Math.max(0, waveBannerTimer - dt);
    return;
  }

  if (keys['ArrowLeft'] || keys['a']) ship.x -= ship.speed * dt;
  if (keys['ArrowRight'] || keys['d']) ship.x += ship.speed * dt;
  ship.x = Math.max(ship.w/2, Math.min(W - ship.w/2, ship.x));

  shipHitFlash = Math.max(0, shipHitFlash - dt);
  invulnerabilityTimer = Math.max(0, invulnerabilityTimer - dt);
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const shot = enemyBullets[i];
    const previousY = shot.y;
    shot.y += 250 * dt;
    if (hitShield(shot.x, previousY, shot.y + 12)) {
      enemyBullets.splice(i, 1);
      continue;
    }
    const hitsBody = shot.x + 2 >= ship.x - ship.w/2 &&
      shot.x - 2 <= ship.x + ship.w/2 &&
      shot.y + 12 >= ship.y && shot.y <= ship.y + ship.h;
    const hitsCannon = shot.x + 2 >= ship.x - 4 &&
      shot.x - 2 <= ship.x + 4 &&
      shot.y + 12 >= ship.y - 10 && shot.y <= ship.y;
    if (hitsBody || hitsCannon) {
      enemyBullets.splice(i, 1);
      if (invulnerabilityTimer === 0) {
        lives--;
        shipHitFlash = 0.25;
        invulnerabilityTimer = 1;
        if (lives === 0) {
          gameState = 'GAME_OVER';
          return;
        }
      }
    } else if (shot.y > H) {
      enemyBullets.splice(i, 1);
    }
  }

  if (keys[' '] && !bullet) bullet = { x: ship.x, y: ship.y - 14 };

  if (bullet) {
    const previousY = bullet.y;
    bullet.y -= 500 * dt;
    if (hitShield(bullet.x, bullet.y - 8, previousY + 4) || bullet.y < -10) bullet = null;
  }

  const alive = aliveInvaders();
  if (alive.length === 0) {
    wave++;
    bullet = null;
    enemyBullets.length = 0;
    enemyFireTimer = nextEnemyFireDelay();
    spawnGrid();
    waveBannerTimer = 1.2;
    return;
  }
  const xs = alive.map(i => invaderScreenPos(i).x);
  const minX = Math.min(...xs), maxX = Math.max(...xs) + SIZE;
  gridX += marchDir * marchSpeed * dt;
  if ((marchDir > 0 && maxX + marchDir*marchSpeed*dt >= W - 8) ||
      (marchDir < 0 && minX + marchDir*marchSpeed*dt <= 8)) {
    marchDir *= -1;
    gridY += 24;
  }

  if (alive.some(inv => invaderScreenPos(inv).y + SIZE >= ship.y)) {
    lostByDescent = true;
    gameState = 'GAME_OVER';
    return;
  }

  if (bullet) {
    for (const inv of alive) {
      const p = invaderScreenPos(inv);
      if (bullet.x > p.x && bullet.x < p.x + SIZE && bullet.y > p.y && bullet.y < p.y + SIZE) {
        inv.alive = false;
        bullet = null;
        score += ROW_POINTS[inv.row];
        if (score > hiScore) {
          hiScore = score;
          try {
            sessionStorage.setItem(HI_SCORE_KEY, String(hiScore));
          } catch (_) { /* The in-memory hi-score still works. */ }
        }
        marchSpeed += 4;
        break;
      }
    }
  }

  if (aliveInvaders().length === 0) {
    wave++;
    bullet = null;
    enemyBullets.length = 0;
    enemyFireTimer = nextEnemyFireDelay();
    spawnGrid();
    waveBannerTimer = 1.2;
    return;
  }

  enemyFireTimer -= dt;
  if (enemyFireTimer <= 0) {
    const bottomInvaders = [];
    for (const inv of aliveInvaders()) {
      const bottom = bottomInvaders[inv.col];
      if (!bottom || inv.row > bottom.row) bottomInvaders[inv.col] = inv;
    }
    const shooters = bottomInvaders.filter(Boolean);
    if (shooters.length) {
      const shooter = shooters[Math.floor(Math.random() * shooters.length)];
      const p = invaderScreenPos(shooter);
      enemyBullets.push({ x: p.x + SIZE/2, y: p.y + SIZE });
    }
    enemyFireTimer = nextEnemyFireDelay();
  }
}

function draw() {
  ctx.fillStyle = '#101018';
  ctx.fillRect(0, 0, W, H);

  for (const shield of shields) {
    if (shield.hits === 0) continue;
    ctx.fillStyle = `hsl(140, 45%, ${20 + shield.hits * 5}%)`;
    ctx.fillRect(shield.x, shield.y, shield.w, shield.h);
    for (let i = 0; i < SHIELD_HITS; i++) {
      ctx.fillStyle = i < shield.hits ? '#b8ffd0' : '#101018';
      ctx.fillRect(shield.x + 7 + i * 10, shield.y + 12, 8, 8);
    }
  }

  if (invulnerabilityTimer === 0 || Math.ceil(invulnerabilityTimer * 10) % 2 === 0) {
    ctx.fillStyle = shipHitFlash > 0 ? '#ff4444' : '#ffc627';
    ctx.fillRect(ship.x - ship.w/2, ship.y, ship.w, ship.h);
    ctx.fillRect(ship.x - 4, ship.y - 10, 8, 10);
  }

  ctx.fillStyle = '#ff6666';
  for (const shot of enemyBullets) {
    ctx.fillRect(shot.x - 2, shot.y, 4, 12);
  }

  if (bullet) {
    ctx.fillStyle = '#efefef';
    ctx.fillRect(bullet.x - 2, bullet.y - 8, 4, 12);
  }

  ctx.fillStyle = '#d4728f';
  for (const inv of aliveInvaders()) {
    const p = invaderScreenPos(inv);
    ctx.fillRect(p.x + 8, p.y + 10, SIZE - 16, SIZE - 24);
    ctx.fillRect(p.x + 2, p.y + 18, SIZE - 4, 8);
  }

  ctx.fillStyle = '#efefef';
  ctx.font = '20px monospace';
  ctx.fillText(`Lives: ${lives}`, 16, 28);
  ctx.save();
  ctx.textAlign = 'right';
  ctx.fillText(`Score: ${score}  Hi-score: ${hiScore}`, W - 16, 28);
  ctx.restore();

  if (waveBannerTimer > 0) {
    ctx.save();
    ctx.fillStyle = '#101018';
    ctx.fillRect(0, H/2 - 36, W, 60);
    ctx.fillStyle = '#efefef';
    ctx.font = '36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`WAVE ${wave}`, W/2, H/2 + 6);
    ctx.restore();
  }

  if (gameState !== 'PLAYING') {
    ctx.save();
    ctx.fillStyle = 'rgba(16, 16, 24, 0.9)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#efefef';
    ctx.font = '36px monospace';
    ctx.textAlign = 'center';
    const title = gameState === 'START' ? 'SPACE DEFENSE' :
      gameState === 'PAUSED' ? 'PAUSED' : 'GAME OVER';
    ctx.fillText(title, W/2, H/2 - 40);
    ctx.font = '20px monospace';
    if (gameState === 'GAME_OVER') {
      ctx.fillText(`Score: ${score}  Hi-score: ${hiScore}`, W/2, H/2);
      ctx.fillText('Press R to restart', W/2, H/2 + 40);
    } else {
      ctx.fillText(gameState === 'START' ? 'Press Space to start' : 'Press P to resume', W/2, H/2 + 20);
    }
    ctx.restore();
  }
}

let last = performance.now();
function loop(t) {
  const dt = Math.min((t - last) / 1000, 0.05);
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
spawnGrid();
requestAnimationFrame(loop);
</script>
</body>
</html>
